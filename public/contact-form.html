<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formulaire de contact</title>
  </head>
  <body>
    <form
      name="contact"
      method="POST"
      action="/merci"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input name="form-name" value="contact" type="hidden" />
      <input name="subject" /><input name="bot-field" /><input name="name" /><input
        name="email"
        type="email"
      /><input name="mission" /><textarea name="message"></textarea>
    </form>
  </body>
</html>
